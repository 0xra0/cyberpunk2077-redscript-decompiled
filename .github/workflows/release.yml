name: Package & Release REDscripts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Release Archives
        run: |
          mkdir -p dist
          zip -9 -j dist/cyberpunk2077-vanilla-reds.zip vanilla/final.reds
          zip -9 -j dist/cyberpunk2077-modded-reds.zip modded/final.modded.reds
          sha256sum vanilla/final.reds modded/final.modded.reds dist/*.zip > checksums.sha256
          cp checksums.sha256 dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/cyberpunk2077-vanilla-reds.zip
            dist/cyberpunk2077-modded-reds.zip
            dist/checksums.sha256
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
